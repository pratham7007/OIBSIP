<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <style>
:root {
  --bg: #f7f7fb;
  --bg-strong: #101828;
  --panel: #ffffff;
  --panel-alt: #eef4ff;
  --primary: #3b82f6;
  --primary-dark: #1d4ed8;
  --secondary: #14b8a6;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #dfe7f5;
  --success: #10b981;
  --warning: #f59e0b;
  --shadow: 0 14px 30px rgba(17, 24, 39, 0.12);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

img {
  max-width: 100%;
  display: block;
}

 a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

.site-header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(6px);
}

.navbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 72px;
}

.brand {
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: 0.04em;
}

.nav-links {
  display: flex;
  gap: 1.5rem;
  align-items: center;
  font-weight: 600;
  color: var(--muted);
}

.nav-links a:hover,
.nav-links a:focus-visible {
  color: var(--primary-dark);
}

.hero {
  padding: 5rem 0 4rem;
  background: linear-gradient(135deg, #eef4ff 0%, #ffffff 42%, #e8fbf8 100%);
}

.hero-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 2rem;
}

.hero-copy {
  flex: 1.2;
}

.kicker {
  display: inline-block;
  padding: 0.4rem 0.85rem;
  border-radius: 999px;
  background: rgba(59, 130, 246, 0.12);
  color: var(--primary-dark);
  font-weight: 700;
  margin-bottom: 1rem;
}

.hero h1 {
  font-size: clamp(2.4rem, 4vw, 4rem);
  margin: 0 0 1rem;
  line-height: 1.1;
}

.hero p {
  font-size: 1.05rem;
  color: var(--muted);
  max-width: 620px;
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-top: 1.8rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.9rem 1.4rem;
  border-radius: 999px;
  border: 0;
  font-weight: 700;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  cursor: pointer;
}

.btn:hover {
  transform: translateY(-1px);
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 12px 20px rgba(59, 130, 246, 0.28);
}

.btn-secondary {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}

.hero-visual {
  flex: 0.8;
}

.showcase-card {
  background: var(--panel);
  border: 2px solid var(--border);
  border-radius: 28px;
  padding: 2rem;
  box-shadow: var(--shadow);
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
  margin-top: 1.5rem;
}

.metric {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 1rem;
  text-align: center;
}

.metric strong {
  display: block;
  font-size: 1.6rem;
}

.section {
  padding: 5rem 0;
}

.section-header {
  text-align: center;
  max-width: 760px;
  margin: 0 auto 2.5rem;
}

.section-header h2 {
  font-size: clamp(2rem, 3vw, 3rem);
  margin: 0 0 0.75rem;
}

.section-header p {
  margin: 0;
  color: var(--muted);
}

.feature-grid,
.project-grid,
.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.5rem;
}

.feature-card,
.project-card,
.testimonial-card,
.skill-card,
.contact-card {
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--panel);
  box-shadow: 0 10px 20px rgba(15, 23, 42, 0.04);
}

.feature-card {
  padding: 1.5rem;
}

.feature-icon {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(20,184,166,0.12));
  color: var(--primary-dark);
  font-size: 1.6rem;
  margin-bottom: 1rem;
}

.feature-card h3,
.project-card h3,
.skill-card h3,
.contact-card h3 {
  margin-top: 0;
  margin-bottom: 0.75rem;
}

.feature-card p,
.project-card p,
.testimonial-card p,
.contact-card p,
.skill-card p {
  margin: 0;
  color: var(--muted);
}

.testimonial-card {
  padding: 1.5rem;
}

.quote-mark {
  font-size: 2rem;
  color: var(--primary);
  line-height: 1;
}

.footer {
  background: var(--bg-strong);
  color: rgba(255,255,255,0.9);
  padding: 3rem 0 1.5rem;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 2rem;
  align-items: center;
  flex-wrap: wrap;
}

.footer-links {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.footer-links a {
  color: rgba(255,255,255,0.8);
}

@media (max-width: 760px) {
  .feature-grid,
  .project-grid,
  .testimonial-grid,
  .metrics {
    grid-template-columns: 1fr;
  }

  .hero-inner {
    flex-direction: column;
  }

  .nav-links {
    gap: 0.75rem;
    font-size: 0.82rem;
  }

  .navbar {
    flex-direction: column;
    justify-content: center;
    padding: 0.75rem 0;
  }

  .site-header {
    position: static;
  }
}

.portfolio-shell {
  background: linear-gradient(180deg, #f6f9ff 0%, #ffffff 100%);
}

.portfolio-hero {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 2rem;
  align-items: center;
  padding: 4rem 0 3rem;
}

.profile-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: #edf7ff;
  color: var(--primary-dark);
  border-radius: 999px;
  padding: 0.5rem 0.9rem;
  font-weight: 700;
}

.profile-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 2rem;
  box-shadow: var(--shadow);
}

.profile-card img {
  display: block;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 3.9 / 5;
  object-fit: cover;
  object-position: center 25%;
  border-radius: 20px;
  margin: 0 auto 1rem;
}

.skill-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 1rem;
}

.skill-card {
  padding: 1.2rem;
  text-align: center;
}

.contact-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}

.contact-card {
  padding: 1.5rem;
}

@media (max-width: 900px) {
  .portfolio-hero,
  .skill-grid,
  .contact-grid {
    grid-template-columns: 1fr;
  }
}

.converter-card {
  width: min(620px, 100%);
  margin: 3rem auto;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 2rem;
}

.converter-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}

label {
  display: block;
  font-weight: 700;
  margin-bottom: 0.5rem;
}

input, select, button {
  font: inherit;
}

.input-wrap {
  width: 100%;
  border: 1px solid var(--border);
  background: #f8fafc;
  border-radius: 12px;
  padding: 0.9rem 1rem;
}

.converter-output {
  background: linear-gradient(180deg, #effaf6 0%, #ffffff 100%);
  border: 1px solid rgba(16, 185, 129, 0.2);
  border-radius: 16px;
  padding: 1.15rem;
  min-height: 80px;
  margin-top: 1rem;
}

.error {
  color: #b91c1c;
  background: #fef2f2;
  border: 1px solid #fecaca;
  padding: 0.8rem 1rem;
  border-radius: 12px;
  margin-top: 1rem;
  display: none;
}

.error.show {
  display: block;
}

.task-index {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.25rem;
  padding: 3rem 0 5rem;
}

.task-card {
  display: block;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 1.5rem;
  box-shadow: 0 10px 25px rgba(15, 23, 42, 0.05);
}

.task-card h3 {
  margin-top: 0;
}

.task-card p {
  color: var(--muted);
}

@media (max-width: 700px) {
  .converter-row,
  .task-index {
    grid-template-columns: 1fr;
  }
}

</style>
  </head>
  <body id="top" style="background: linear-gradient(135deg, #eff6ff, #f9fafb);">
    <header class="site-header">
      <div class="container navbar">
        <div class="brand">TEMP CONVERTER</div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="#top">Home</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="converter-card">
        <div class="section-header" style="margin-bottom:1.5rem;">
          <h2>Temperature Converter</h2>
          <p>Convert between Celsius, Fahrenheit, and Kelvin in real time.</p>
        </div>

        <div class="converter-row">
          <div>
            <label for="temperature">Value</label>
            <input id="temperature" class="input-wrap" type="number" step="any" placeholder="Enter a temperature" />
          </div>

          <div>
            <label for="fromUnit">From unit</label>
            <select id="fromUnit" class="input-wrap">
              <option value="c">Celsius (°C)</option>
              <option value="f">Fahrenheit (°F)</option>
              <option value="k">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <div class="converter-row">
          <div>
            <label for="toUnit">To unit</label>
            <select id="toUnit" class="input-wrap">
              <option value="c">Celsius (°C)</option>
              <option value="f">Fahrenheit (°F)</option>
              <option value="k">Kelvin (K)</option>
            </select>
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="convertBtn" class="btn btn-primary" type="button" style="width:100%;">Convert</button>
          </div>
        </div>

        <div id="result" class="converter-output" aria-live="polite">
          Result will appear here.
        </div>

        <div id="errorBox" class="error" role="alert"></div>
      </div>
    </main>

    <script>
const temperatureInput = document.getElementById('temperature');
const fromUnit = document.getElementById('fromUnit');
const toUnit = document.getElementById('toUnit');
const result = document.getElementById('result');
const errorBox = document.getElementById('errorBox');
const convertBtn = document.getElementById('convertBtn');

function toCelsius(value, unit) {
  switch (unit) {
    case 'c': return value;
    case 'f': return (value - 32) * 5 / 9;
    case 'k': return value - 273.15;
    default: return value;
  }
}

function fromCelsius(value, unit) {
  switch (unit) {
    case 'c': return value;
    case 'f': return (value * 9 / 5) + 32;
    case 'k': return value + 273.15;
    default: return value;
  }
}

function renderError(message) {
  errorBox.textContent = message;
  errorBox.classList.add('show');
  result.textContent = 'Result will appear here.';
}

function clearError() {
  errorBox.textContent = '';
  errorBox.classList.remove('show');
}

function convertTemperature() {
  const rawValue = temperatureInput.value.trim();

  if (rawValue === '') {
    renderError('Please enter a temperature value.');
    return;
  }

  const numericValue = Number(rawValue);
  if (Number.isNaN(numericValue)) {
    renderError('Please enter a valid numeric temperature.');
    return;
  }

  const celsius = toCelsius(numericValue, fromUnit.value);
  if (celsius < -273.15) {
    renderError('Absolute zero violation: temperature cannot be below -273.15°C.');
    return;
  }

  const converted = fromCelsius(celsius, toUnit.value);
  const formatted = Number.isInteger(converted) ? converted.toFixed(0) : converted.toFixed(2);
  clearError();
  result.textContent = `${numericValue} ${fromUnit.options[fromUnit.selectedIndex].text} = ${formatted} ${toUnit.options[toUnit.selectedIndex].text}`;
}

convertBtn.addEventListener('click', convertTemperature);
fromUnit.addEventListener('change', convertTemperature);
toUnit.addEventListener('change', convertTemperature);
temperatureInput.addEventListener('input', () => {
  if (temperatureInput.value.trim() !== '') {
    clearError();
  }
});

</script>
  </body>
</html>
