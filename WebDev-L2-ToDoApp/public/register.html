<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — Level 2</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js" defer></script>
</head>
<body>
  <header class="bar"><nav class="wrap nav" aria-label="Main navigation"><a class="brand" href="/">OASIS / WEB</a><div class="navlinks"><a href="/">All tasks</a><a href="/login.html">Sign in</a></div></nav></header>
  <main class="wrap"><section class="auth-card">
    <span class="eyebrow">Level 2 · Task 4</span><h1>Create an account.</h1><p>Use at least eight characters and include a number in your password.</p>
    <form class="auth-form" id="register-form">
      <label>Email<input class="field" type="email" name="email" autocomplete="email" required></label>
      <label>Password<input class="field" type="password" name="password" minlength="8" autocomplete="new-password" required></label>
      <button class="button" type="submit">Register</button>
    </form>
    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
    <p class="auth-bottom">Already registered? <a href="/login.html"><strong>Sign in</strong></a></p>
  </section></main>
</body>
</html>
