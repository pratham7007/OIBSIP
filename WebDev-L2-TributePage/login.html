<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Level 2</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js" defer></script>
</head>
<body>
  <header class="bar"><nav class="wrap nav" aria-label="Main navigation"><a class="brand" href="/">OASIS / WEB</a><div class="navlinks"><a href="/">All tasks</a><a href="/register.html">Create account</a></div></nav></header>
  <main class="wrap"><section class="auth-card">
    <span class="eyebrow">Level 2 · Task 4</span><h1>Welcome back.</h1><p>Sign in to open your protected dashboard.</p>
    <form class="auth-form" id="login-form">
      <label>Email<input class="field" type="email" name="email" autocomplete="username" required></label>
      <label>Password<input class="field" type="password" name="password" autocomplete="current-password" required></label>
      <button class="button" type="submit">Sign in</button>
    </form>
    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
    <p class="auth-bottom">New here? <a href="/register.html"><strong>Create an account</strong></a></p>
  </section></main>
</body>
</html>
