<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator — Level 2</title>
  <style>
500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

:root {
  color-scheme: light;
  --ink: #17211b;
  --muted: #65736b;
  --paper: #f6f7f1;
  --surface: #fffefa;
  --line: #dce4da;
  --green: #205b45;
  --mint: #d9eee1;
  --orange: #e88751;
  --shadow: 0 18px 50px rgba(24, 50, 37, .1);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font: 16px/1.65 'DM Sans', sans-serif;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
img { display: block; max-width: 100%; }
.wrap { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
.bar {
  position: sticky; top: 0; z-index: 5;
  border-bottom: 1px solid rgba(220, 228, 218, .8);
  background: rgba(255, 254, 250, .91);
  backdrop-filter: blur(14px);
}
.nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.brand { font: 800 1.05rem 'Manrope', sans-serif; letter-spacing: .12em; }
.navlinks { display: flex; align-items: center; gap: 24px; color: var(--muted); font-weight: 600; }
.navlinks a:hover, .navlinks a:focus-visible { color: var(--green); }
.button {
  display: inline-flex; min-height: 48px; align-items: center; justify-content: center;
  padding: 11px 20px; border: 0; border-radius: 999px;
  color: white; background: var(--green); font-weight: 700; cursor: pointer;
  transition: transform .18s ease, box-shadow .18s ease;
}
.button:hover { transform: translateY(-2px); box-shadow: 0 9px 22px rgba(32, 91, 69, .2); }
.button.outline { color: var(--green); background: transparent; border: 1px solid var(--line); }
.button.small { min-height: 38px; padding: 7px 14px; font-size: .9rem; }
.eyebrow { color: var(--green); font-size: .76rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
h1, h2, h3 { font-family: 'Manrope', sans-serif; line-height: 1.12; }
h1 { font-size: clamp(2.6rem, 6vw, 5rem); letter-spacing: -.055em; }
h2 { font-size: clamp(2rem, 4vw, 3.2rem); letter-spacing: -.04em; }
h3 { font-size: 1.3rem; }
p { color: var(--muted); }
.hero { padding: clamp(64px, 10vw, 126px) 0 80px; background: radial-gradient(ellipse at 82% 15%, #e0eee0 0, transparent 38%), var(--paper); }
.hero-grid { display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: clamp(32px, 7vw, 88px); }
.hero h1 { max-width: 700px; margin: 18px 0; }
.hero-copy > p { max-width: 570px; font-size: 1.12rem; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.hero-art {
  min-height: 350px; display: grid; place-items: center; overflow: hidden;
  border-radius: 38% 62% 52% 48% / 50% 43% 57% 50%;
  background: linear-gradient(145deg, #bedcc7, #edf2d8);
}
.art-card { width: min(75%, 340px); padding: 28px; border: 1px solid rgba(255,255,255,.8); border-radius: 24px; background: rgba(255,254,250,.87); box-shadow: var(--shadow); transform: rotate(-3deg); }
.art-card span { display: block; color: var(--muted); }
.art-card strong { display: block; margin: 9px 0 18px; font: 800 2.4rem 'Manrope', sans-serif; }
.bars { display: grid; gap: 9px; }
.bars i { height: 9px; border-radius: 20px; background: var(--mint); }
.bars i:nth-child(2) { width: 78%; background: #e5bd93; }
.bars i:nth-child(3) { width: 56%; }
.section { padding: 88px 0; }
.section-head { max-width: 680px; margin: 0 auto 38px; text-align: center; }
.section-head h2 { margin: 12px 0; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.card { padding: 26px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.card p { margin-bottom: 0; }
.icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 16px; background: var(--mint); font-size: 1.3rem; }
.band { background: #eaf0e5; }
.quote { padding: 30px; border-left: 4px solid var(--orange); border-radius: 0 18px 18px 0; background: #fffefa; font: 600 1.25rem/1.5 'Manrope', sans-serif; }
.footer { padding: 30px 0; border-top: 1px solid var(--line); }
.footer-inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.footer p { margin: 0; font-size: .9rem; }
.task-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 42px 0 88px; }
.task-link { display: block; padding: 26px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); transition: transform .18s, box-shadow .18s; }
.task-link:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.task-link h3 { margin: 8px 0; }
.task-link p { margin: 0; }
.page-intro { padding: 56px 0 10px; }
.page-intro h1 { font-size: clamp(2.3rem, 5vw, 3.7rem); margin: 10px 0; }
.calculator { width: min(430px, 100%); margin: 36px auto 90px; padding: 22px; border: 1px solid var(--line); border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); }
.calc-display { min-height: 110px; display: flex; align-items: end; justify-content: flex-end; overflow: hidden; padding: 15px; border-radius: 16px; background: #edf2e8; font: 700 2rem 'Manrope', sans-serif; overflow-wrap: anywhere; }
.calc-error { min-height: 24px; padding: 6px 4px; color: #a63e30; font-size: .88rem; }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
.key { min-height: 58px; border: 0; border-radius: 15px; background: #f0f2ec; font-weight: 700; cursor: pointer; }
.key:hover { background: #e3ebe1; }
.key.operator { color: var(--green); background: #e4efe5; }
.key.action { color: #98513a; background: #f8eadd; }
.key.equal { color: white; background: var(--green); }
.portrait { width: min(100%, 440px); max-height: 510px; object-fit: cover; object-position: center 28%; border-radius: 190px 190px 24px 24px; box-shadow: var(--shadow); }
.tribute-hero { padding: 62px 0; background: #eaf0e5; }
.tribute-grid { display: grid; grid-template-columns: 1fr .8fr; align-items: center; gap: 52px; }
.tribute-grid h1 { font-size: clamp(3rem, 6vw, 5.2rem); margin: 12px 0; }
.caption { margin-top: 8px; text-align: right; font-size: .8rem; }
.timeline { display: grid; gap: 14px; max-width: 800px; margin: auto; }
.time-item { display: grid; grid-template-columns: 94px 1fr; gap: 20px; padding: 20px; border-radius: 16px; background: var(--surface); }
.time-item time { color: var(--green); font-weight: 800; }
.todo-app { padding: 44px 0 90px; }
.todo-form { display: flex; gap: 10px; margin: 24px 0; }
.field { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: white; }
.todo-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.todo-panel { min-width: 0; padding: 22px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); }
.todo-panel h2 { display: flex; justify-content: space-between; gap: 10px; font-size: 1.35rem; }
.count { color: var(--muted); font: 600 .85rem 'DM Sans', sans-serif; }
.todo-list { display: grid; gap: 10px; padding: 0; list-style: none; }
.todo-item { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 14px; }
.todo-text { min-width: 0; flex: 1; overflow-wrap: anywhere; }
.todo-meta { display: block; color: var(--muted); font-size: .78rem; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--muted); }
.todo-actions { display: flex; flex-wrap: wrap; justify-content: end; gap: 6px; }
.todo-actions button { min-height: 34px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 9px; background: white; cursor: pointer; }
.empty { padding: 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
.notice { min-height: 26px; margin: 10px 0; color: #a63e30; }
.auth-card { width: min(480px, 100%); margin: 48px auto 90px; padding: 30px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); }
.auth-card h1 { font-size: 2rem; margin: 0 0 8px; }
.auth-form { display: grid; gap: 14px; margin-top: 22px; }
.auth-form label { display: grid; gap: 6px; font-weight: 700; }
.form-message { min-height: 26px; margin: 6px 0; color: var(--green); }
.form-message.error { color: #a63e30; }
.auth-bottom { margin: 18px 0 0; }
.profile-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; }

@media (max-width: 760px) {
  .nav { min-height: 68px; flex-wrap: wrap; padding: 12px 0; }
  .navlinks { gap: 14px; font-size: .9rem; }
  .hero-grid, .tribute-grid { grid-template-columns: 1fr; }
  .hero-art { min-height: 270px; }
  .grid, .todo-columns { grid-template-columns: 1fr; }
  .section { padding: 64px 0; }
  .task-grid { grid-template-columns: 1fr; }
}
@media (max-width: 480px) {
  .wrap { width: min(100% - 28px, 1120px); }
  .nav { align-items: flex-start; }
  .navlinks { width: 100%; justify-content: space-between; }
  .todo-form { flex-direction: column; }
  .todo-item { align-items: flex-start; flex-wrap: wrap; }
  .todo-actions { width: 100%; justify-content: flex-start; }
  .time-item { grid-template-columns: 1fr; gap: 4px; }
}

</style>
</head>
<body id="top">
  <header class="bar"><nav class="wrap nav" aria-label="Main navigation"><a class="brand" href="#top">OASIS / WEB</a><div class="navlinks"><a href="#top">All tasks</a><a href="#top">Tribute</a><a href="#top">To-do app</a></div></nav></header>
  <main class="wrap">
    <section class="page-intro"><span class="eyebrow">Level 2 · Task 1</span><h1>Calculator</h1><p>Chain operations naturally; multiplication and division follow standard precedence.</p></section>
    <section class="calculator" aria-label="Calculator">
      <output id="display" class="calc-display" aria-live="polite">0</output>
      <p id="calc-error" class="calc-error" role="alert"></p>
      <div class="keys" id="keys">
        <button class="key action" data-action="clear" type="button">C</button>
        <button class="key action" data-action="backspace" type="button" aria-label="Backspace">⌫</button>
        <button class="key operator" data-value="(" type="button">(</button>
        <button class="key operator" data-value=")" type="button">)</button>
        <button class="key" data-value="7" type="button">7</button><button class="key" data-value="8" type="button">8</button><button class="key" data-value="9" type="button">9</button><button class="key operator" data-value="/" type="button">÷</button>
        <button class="key" data-value="4" type="button">4</button><button class="key" data-value="5" type="button">5</button><button class="key" data-value="6" type="button">6</button><button class="key operator" data-value="*" type="button">×</button>
        <button class="key" data-value="1" type="button">1</button><button class="key" data-value="2" type="button">2</button><button class="key" data-value="3" type="button">3</button><button class="key operator" data-value="-" type="button">−</button>
        <button class="key" data-value="0" type="button">0</button><button class="key" data-value="." type="button">.</button><button class="key equal" data-action="equals" type="button">=</button><button class="key operator" data-value="+" type="button">+</button>
      </div>
    </section>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><a class="brand" href="#top">OASIS / WEB</a><p>All arithmetic is parsed without eval().</p></div></footer>

<script>
const display = document.querySelector('#display');
const errorOutput = document.querySelector('#calc-error');
const keys = document.querySelector('#keys');
let expression = '';
let justEvaluated = false;

function showExpression() {
  display.textContent = expression.replaceAll('*', '×').replaceAll('/', '÷') || '0';
}

function tokenize(source) {
  const tokens = [];
  let index = 0;
  while (index < source.length) {
    if (/\s/.test(source[index])) {
      index += 1;
      continue;
    }
    const start = index;
    if (/[0-9.]/.test(source[index])) {
      let dots = 0;
      while (index < source.length && /[0-9.]/.test(source[index])) {
        if (source[index] === '.') dots += 1;
        if (dots > 1) throw new Error('A number cannot contain more than one decimal point.');
        index += 1;
      }
      const text = source.slice(start, index);
      if (text === '.') throw new Error('Enter a digit with the decimal point.');
      tokens.push({ type: 'number', value: Number(text) });
      continue;
    }
    if ('+-*/()'.includes(source[index])) {
      tokens.push({ type: source[index], value: source[index] });
      index += 1;
      continue;
    }
    throw new Error('Only numbers and +, −, ×, ÷, and parentheses are supported.');
  }
  return tokens;
}

function evaluate(source) {
  const tokens = tokenize(source);
  let cursor = 0;

  function parsePrimary() {
    const token = tokens[cursor];
    if (!token) throw new Error('Complete the expression before calculating.');
    if (token.type === 'number') {
      cursor += 1;
      return token.value;
    }
    if (token.type === '(') {
      cursor += 1;
      const value = parseExpression();
      if (tokens[cursor]?.type !== ')') throw new Error('Add a closing parenthesis.');
      cursor += 1;
      return value;
    }
    throw new Error('Enter a number where expected.');
  }

  function parseUnary() {
    if (tokens[cursor]?.type === '+') {
      cursor += 1;
      return parseUnary();
    }
    if (tokens[cursor]?.type === '-') {
      cursor += 1;
      return -parseUnary();
    }
    return parsePrimary();
  }

  function parseTerm() {
    let value = parseUnary();
    while (tokens[cursor]?.type === '*' || tokens[cursor]?.type === '/') {
      const operator = tokens[cursor++].type;
      const right = parseUnary();
      if (operator === '/' && right === 0) throw new Error('Cannot divide by zero.');
      value = operator === '*' ? value * right : value / right;
    }
    return value;
  }

  function parseExpression() {
    let value = parseTerm();
    while (tokens[cursor]?.type === '+' || tokens[cursor]?.type === '-') {
      const operator = tokens[cursor++].type;
      const right = parseTerm();
      value = operator === '+' ? value + right : value - right;
    }
    return value;
  }

  const result = parseExpression();
  if (cursor !== tokens.length) throw new Error('Check the expression and parentheses.');
  if (!Number.isFinite(result)) throw new Error('The result is outside the supported numeric range.');
  return result;
}

function calculate() {
  if (!expression) return;
  try {
    const result = evaluate(expression);
    expression = String(Number(result.toPrecision(12)));
    justEvaluated = true;
    errorOutput.textContent = '';
    showExpression();
  } catch (error) {
    errorOutput.textContent = error.message;
  }
}

function appendValue(value) {
  errorOutput.textContent = '';
  if (justEvaluated && /[0-9.(]/.test(value)) expression = '';
  justEvaluated = false;
  expression += value;
  showExpression();
}

keys.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.action === 'clear') {
    expression = '';
    justEvaluated = false;
    errorOutput.textContent = '';
    showExpression();
  } else if (button.dataset.action === 'backspace') {
    expression = expression.slice(0, -1);
    errorOutput.textContent = '';
    justEvaluated = false;
    showExpression();
  } else if (button.dataset.action === 'equals') {
    calculate();
  } else if (button.dataset.value) {
    appendValue(button.dataset.value);
  }
});

document.addEventListener('keydown', (event) => {
  if (/^[0-9.+\-*/()]$/.test(event.key)) {
    event.preventDefault();
    appendValue(event.key);
  } else if (event.key === 'Enter' || event.key === '=') {
    event.preventDefault();
    calculate();
  } else if (event.key === 'Backspace') {
    expression = expression.slice(0, -1);
    showExpression();
  } else if (event.key === 'Escape') {
    expression = '';
    errorOutput.textContent = '';
    showExpression();
  }
});
</script>
</body>
