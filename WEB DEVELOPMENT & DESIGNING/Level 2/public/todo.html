<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-do App — Level 2</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/todo.js" defer></script>
</head>
<body>
  <header class="bar"><nav class="wrap nav" aria-label="Main navigation"><a class="brand" href="/">OASIS / WEB</a><div class="navlinks"><a href="/">All tasks</a><a href="/calculator.html">Calculator</a><a href="/login.html">Authentication</a></div></nav></header>
  <main class="wrap todo-app">
    <span class="eyebrow">Level 2 · Task 3</span><h1 style="font-size:clamp(2.5rem,5vw,4rem);margin:10px 0">Make room for what matters.</h1>
    <p>Capture the next thing. You can edit, complete, or remove it whenever plans change.</p>
    <form class="todo-form" id="todo-form"><label class="sr-only" for="task-input" style="position:absolute;left:-10000px">New task</label><input class="field" id="task-input" maxlength="240" placeholder="What needs doing?" required><button class="button" type="submit">Add task</button></form>
    <p id="storage-message" class="notice" role="status" aria-live="polite"></p>
    <div class="todo-columns">
      <section class="todo-panel" aria-labelledby="pending-heading"><h2 id="pending-heading">Pending <span class="count" id="pending-count">0 pending</span></h2><ul class="todo-list" id="pending-list"></ul></section>
      <section class="todo-panel" aria-labelledby="completed-heading"><h2 id="completed-heading">Completed <span class="count" id="completed-count">0 completed</span></h2><ul class="todo-list" id="completed-list"></ul></section>
    </div>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><a class="brand" href="/">OASIS / WEB</a><p>Your tasks are saved in this browser.</p></div></footer>
</body>
</html>
