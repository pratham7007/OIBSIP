<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body style="background: linear-gradient(135deg, #eff6ff, #f9fafb);">
    <header class="site-header">
      <div class="container navbar">
        <div class="brand">TEMP CONVERTER</div>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="landing-page.html">Landing</a>
          <a href="portfolio.html">Portfolio</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="converter-card">
        <div class="section-header" style="margin-bottom:1.5rem;">
          <h2>Temperature Converter</h2>
          <p>Convert between Celsius, Fahrenheit, and Kelvin in real time.</p>
        </div>

        <div class="converter-row">
          <div>
            <label for="temperature">Value</label>
            <input id="temperature" class="input-wrap" type="number" step="any" placeholder="Enter a temperature" />
          </div>

          <div>
            <label for="fromUnit">From unit</label>
            <select id="fromUnit" class="input-wrap">
              <option value="c">Celsius (°C)</option>
              <option value="f">Fahrenheit (°F)</option>
              <option value="k">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <div class="converter-row">
          <div>
            <label for="toUnit">To unit</label>
            <select id="toUnit" class="input-wrap">
              <option value="c">Celsius (°C)</option>
              <option value="f">Fahrenheit (°F)</option>
              <option value="k">Kelvin (K)</option>
            </select>
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="convertBtn" class="btn btn-primary" type="button" style="width:100%;">Convert</button>
          </div>
        </div>

        <div id="result" class="converter-output" aria-live="polite">
          Result will appear here.
        </div>

        <div id="errorBox" class="error" role="alert"></div>
      </div>
    </main>

    <script src="temperature.js"></script>
  </body>
</html>
